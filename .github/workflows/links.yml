name: Links

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run: a linked repository can become private or be renamed
  # without any change in this repository
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v5 and later run on Node.js 24; v4 targets Node.js 20, deprecated on the runners
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What a visitor clicks: every link of the two pages, online.
      # A link to a private repository returns 404 here, as it does for a visitor.
      # --root-dir resolves the absolute paths of 404.html (/assets/...) inside the repository.
      # 429 = "too many requests": the site is up but rate-limits the checker
      - name: Check page links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept "200..=299,429"
            --root-dir "${{ github.workspace }}"
            index.html 404.html
          fail: true

      # Documentation: links between files only, so a slow external site
      # cannot make the build fail
      - name: Check relative links in the documentation
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true
